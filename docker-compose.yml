services:
  app:
    build: .
    ports:
      # Host port is configurable so a local dev server can keep 3000.
      - "${APP_PORT:-3000}:3000"
    environment:
      # Long random string — encrypts provider keys and signs sessions. Change before first boot.
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env (e.g. openssl rand -hex 32)}
      DATABASE_URL: file:/app/db/custom.db
      # The public origin your browser and webhooks (Twilio/Stripe) use.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    volumes:
      - ais-data:/app/db
      - ais-secrets:/app/.data
      - ais-backups:/app/backups
      - ais-models:/app/.models
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: unless-stopped

volumes:
  ais-data:
  ais-secrets:
  ais-backups:
  ais-models:
